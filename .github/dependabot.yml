version: 2
registries:
  dotnet-public:
    type: nuget-feed
    url: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - dotnet-public
    open-pull-requests-limit: 5
    schedule:
      interval: "monthly"
    labels:
      - "area-infrastructure"
